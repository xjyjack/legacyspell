# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=false

# Minecraft
minecraft_version=1.12.2
minecraft_version_range=[1.12.2, 1.13)
mappings_channel=stable
mappings_version=39-1.12

# Forge
forge_version=14.23.5.2860
forge_group=net.minecraftforge

# MOD
mod_id=legacyspell
mod_name=LegacySpell
mod_author=legacyspell
mod_description=An Electroblob's Wizardry addon that adds the Wind Blade spell, ported from wind_spellbooks.
version_major=1
version_minor=0
version_patch=3

# Dependencies (CurseMaven coordinates)
# Electroblob's Wizardry - required, this is the API the addon plugs into.
wizardry_projectid=265642
wizardry_version=4.3.6
wizardry_fileid=6950392
